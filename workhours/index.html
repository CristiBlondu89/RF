<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Work Hours · All Months</title>

<style>
    :root {
        --bg-page: #0f1117;
        --bg-card: #1c1f2a;
        --bg-card-alt: #242838;
        --bg-toggle-off: #4b5563;
        --bg-toggle-on: #34d399;
        --text-primary: #f9fafb;
        --text-dim: #9ca3af;
        --accent: #38bdf8;
        --radius-card: 16px;
        --radius-inner: 10px;
        --border-card: rgba(255,255,255,0.07);
        --border-inner: rgba(255,255,255,0.08);
    }

    * {
        box-sizing: border-box;
        -webkit-font-smoothing: antialiased;
    }

    body {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "SF Pro Text", Roboto, "Helvetica Neue", sans-serif;
        background-color: var(--bg-page);
        color: var(--text-primary);
        margin: 0;
        padding: 8px;
        line-height: 1.3;
        display: flex;
        flex-direction: column;
        gap: 8px;
        max-width: 1900px;
        margin-left: auto;
        margin-right: auto;
        font-size: 14px;
    }

    header h1 {
        margin: 0 0 2px 0;
        font-weight: 600;
        font-size: 1.1rem;
        color: var(--text-primary);
        letter-spacing: -0.03em;
    }

    header .subtitle {
        font-size: 0.75rem;
        color: var(--text-dim);
    }

    /* Month / year selector bar */
    .month-bar {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        align-items: center;
        justify-content: space-between;
    }

    .month-controls {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        align-items: center;
    }

    .month-select,
    .year-select {
        background-color: #020617;
        color: var(--text-primary);
        border-radius: 999px;
        border: 1px solid rgba(148,163,184,0.6);
        padding: 4px 10px;
        font-size: 0.8rem;
        outline: none;
    }

    .nav-btn {
        background: linear-gradient(135deg, #0f172a, #020617);
        color: var(--text-primary);
        border-radius: 999px;
        border: 1px solid rgba(148,163,184,0.7);
        padding: 4px 10px;
        font-size: 0.8rem;
        cursor: pointer;
    }

    .nav-btn:hover {
        border-color: var(--accent);
    }

    .current-label {
        font-size: 0.75rem;
        color: var(--text-dim);
    }

    /* Grid of day cards - more columns, smaller cards */
    .days-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        gap: 8px;
    }

    .day-card {
        background: radial-gradient(circle at 0% 0%, rgba(56,189,248,0.05) 0%, rgba(0,0,0,0) 60%), var(--bg-card);
        border: 1px solid var(--border-card);
        border-radius: var(--radius-card);
        padding: 10px;
        display: flex;
        flex-direction: column;
        gap: 8px;
        box-shadow: 0 12px 24px rgba(0,0,0,0.6);
    }

    .day-header-row {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
    }

    .day-left {
        display: flex;
        flex-direction: row;
        gap: 6px;
        align-items: baseline;
    }

    .day-number {
        font-size: 1.05rem;
        font-weight: 600;
        color: var(--accent);
        min-width: 2ch;
        text-align: right;
    }
    .day-weekday {
        font-size: 0.7rem;
        color: var(--text-dim);
        font-weight: 500;
    }

    .include-toggle-wrapper {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 0.7rem;
        color: var(--text-dim);
        user-select: none;
    }

    /* iOS-style toggle */
    .toggle-label {
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        gap: 6px;
    }

    .toggle-track {
        width: 40px;
        height: 20px;
        border-radius: 999px;
        background-color: var(--bg-toggle-off);
        position: relative;
        transition: background-color 0.18s;
        border: 1px solid rgba(0,0,0,0.4);
        box-shadow: inset 0 2px 3px rgba(0,0,0,0.6);
    }

    .toggle-thumb {
        position: absolute;
        top: 2px;
        left: 2px;
        width: 16px;
        height: 16px;
        background: radial-gradient(circle at 30% 30%, #fff 0%, #d1d5db 60%);
        border-radius: 50%;
        box-shadow: 0 4px 8px rgba(0,0,0,0.6);
        transition: transform 0.18s;
    }

    .include-row:checked + .toggle-track {
        background-color: var(--bg-toggle-on);
        box-shadow: 0 0 10px rgba(16,185,129,0.6);
    }
    .include-row:checked + .toggle-track .toggle-thumb {
        transform: translateX(18px);
    }

    .include-row {
        position: absolute;
        opacity: 0;
        pointer-events: none;
    }

    /* Time block styling - compact */
    .time-blocks {
        background-color: var(--bg-card-alt);
        border: 1px solid var(--border-inner);
        border-radius: var(--radius-inner);
        padding: 8px;
        display: grid;
        grid-template-columns: 1fr 1fr;
        row-gap: 6px;
        column-gap: 6px;
    }

    .time-field {
        display: flex;
        flex-direction: column;
        gap: 4px;
    }

    .time-label {
        color: var(--text-dim);
        font-size: 0.65rem;
        font-weight: 500;
        letter-spacing: -0.02em;
        display: flex;
        justify-content: space-between;
    }

    .picker-row {
        display: flex;
        flex-wrap: nowrap;
        gap: 4px;
        align-items: center;
    }

    .time-select-hour,
    .time-select-minute {
        appearance: none;
        -webkit-appearance: none;
        background-color: #0f172a;
        background-image: radial-gradient(circle at 50% 0%, rgba(255,255,255,0.16) 0%, rgba(0,0,0,0) 60%);
        color: var(--text-primary);
        font-size: 0.75rem;
        font-weight: 500;
        padding: 4px 6px;
        border-radius: 8px;
        border: 1px solid rgba(255,255,255,0.15);
        min-width: 50px;
        text-align: center;
        line-height: 1.2;
        box-shadow: 0 8px 16px rgba(0,0,0,0.8), 0 0 20px rgba(56,189,248,0.12);
    }

    .time-separator {
        color: var(--text-dim);
        font-size: 0.8rem;
        font-weight: 500;
        min-width: 6px;
        text-align: center;
        user-select: none;
    }

    .total-today {
        font-size: 0.7rem;
        font-weight: 500;
        color: var(--text-primary);
        background-color: rgba(0,0,0,0.4);
        border: 1px solid var(--border-inner);
        border-radius: 6px;
        padding: 4px 6px;
        text-align: center;
    }

    .summary-wrap {
        display: grid;
        gap: 8px;
        margin-top: 8px;
        margin-bottom: 16px;
    }

    @media (min-width: 480px) {
        .summary-wrap {
            grid-template-columns: 1fr 1fr;
        }
    }

    .summary-card {
        background: radial-gradient(circle at 0% 0%, rgba(16,185,129,0.08) 0%, rgba(0,0,0,0) 60%), var(--bg-card);
        border: 1px solid var(--border-card);
        border-radius: var(--radius-card);
        padding: 10px;
        box-shadow: 0 12px 24px rgba(0,0,0,0.8);
        display: flex;
        flex-direction: column;
        gap: 4px;
    }

    .summary-label {
        font-size: 0.65rem;
        font-weight: 500;
        color: var(--text-dim);
        letter-spacing: -0.02em;
    }

    .summary-value {
        font-size: 0.9rem;
        color: var(--text-primary);
        font-weight: 600;
        letter-spacing: -0.03em;
    }

    footer.note {
        font-size: 0.65rem;
        line-height: 1.3;
        color: var(--text-dim);
        text-align: center;
        margin-bottom: 16px;
    }
</style>
</head>

<body>
<header>
    <h1>Work Hours · All Months</h1>
    <div class="subtitle">
        Pick a month/year, enter your hours. Each month is saved separately on this PC.
    </div>
</header>

<section class="month-bar">
    <div class="month-controls">
        <button class="nav-btn" id="prevMonthBtn">◀</button>
        <select class="month-select" id="monthSelect"></select>
        <select class="year-select" id="yearSelect"></select>
        <button class="nav-btn" id="nextMonthBtn">▶</button>
        <button class="nav-btn" id="todayBtn">Today</button>
    </div>
    <div class="current-label" id="currentKeyLabel"></div>
</section>

<section class="days-grid" id="daysGrid"></section>

<section class="summary-wrap">
    <div class="summary-card">
        <div class="summary-label">Selected Period Total (toggled "Include")</div>
        <div class="summary-value" id="selected-total">0 hours 0 minutes</div>
    </div>
    <div class="summary-card">
        <div class="summary-label">This Month Total</div>
        <div class="summary-value" id="grand-total">0 hours 0 minutes</div>
    </div>
</section>

<footer class="note">
    Tip: Every month is stored separately.  
    Storage key looks like <code>workhours-2025-11</code> for November 2025.
</footer>

<script>
    const STORAGE_PREFIX = "workhours"; // base prefix
    const daysGrid = document.getElementById("daysGrid");

    // --- Month / Year setup ---
    const monthSelect = document.getElementById("monthSelect");
    const yearSelect = document.getElementById("yearSelect");
    const prevMonthBtn = document.getElementById("prevMonthBtn");
    const nextMonthBtn = document.getElementById("nextMonthBtn");
    const todayBtn = document.getElementById("todayBtn");
    const currentKeyLabel = document.getElementById("currentKeyLabel");

    const MONTH_NAMES = [
        "January","February","March","April","May","June",
        "July","August","September","October","November","December"
    ];
    const WEEKDAY_NAMES = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];

    let currentYear;
    let currentMonthIndex; // 0-11

    function pad2(n) {
        return String(n).padStart(2, "0");
    }

    function getStorageKey(year, monthIndex) {
        return `${STORAGE_PREFIX}-${year}-${pad2(monthIndex+1)}`;
    }

    function populateMonthYearSelectors() {
        // Months
        monthSelect.innerHTML = MONTH_NAMES
            .map((name, idx) => `<option value="${idx}">${name}</option>`)
            .join("");

        // Years (e.g. 2020..2030, adjust to what you want)
        const startYear = 2020;
        const endYear = 2035;
        let options = "";
        for (let y = startYear; y <= endYear; y++) {
            options += `<option value="${y}">${y}</option>`;
        }
        yearSelect.innerHTML = options;
    }

    function setMonthYear(year, monthIndex) {
        currentYear = year;
        currentMonthIndex = monthIndex;
        monthSelect.value = String(monthIndex);
        yearSelect.value = String(year);

        const storageKey = getStorageKey(currentYear, currentMonthIndex);
        currentKeyLabel.textContent = `Storage key: ${storageKey}`;
        buildMonthDays();
        loadState();
        updateTotals();
    }

    function changeMonth(delta) {
        let m = currentMonthIndex + delta;
        let y = currentYear;
        if (m < 0) {
            m = 11;
            y -= 1;
        } else if (m > 11) {
            m = 0;
            y += 1;
        }
        setMonthYear(y, m);
    }

    // --- Build day cards for the chosen month ---
    function buildMonthDays() {
        const year = currentYear;
        const monthIndex = currentMonthIndex;

        // last day of month: passing day=0 of next month
        const lastDay = new Date(year, monthIndex + 1, 0).getDate();

        let html = "";
        for (let day = 1; day <= lastDay; day++) {
            const date = new Date(year, monthIndex, day);
            const weekday = WEEKDAY_NAMES[date.getDay()];

            html += makeDayCard(day, weekday);
        }
        daysGrid.innerHTML = html;

        attachDayListeners();
    }

    function buildHourOptions() {
        let html = `<option value="">--</option>`;
        for (let h = 0; h < 24; h++) {
            const hh = String(h).padStart(2, "0");
            html += `<option value="${hh}">${hh}</option>`;
        }
        return html;
    }

    function buildMinuteOptions() {
        let html = "";
        for (let m = 0; m < 60; m += 5) {
            const mm = String(m).padStart(2, "0");
            html += `<option value="${mm}">${mm}</option>`;
        }
        return html;
    }

    const HOUR_OPTIONS = buildHourOptions();
    const MIN_OPTIONS = buildMinuteOptions();

    function makeDayCard(day, weekday) {
        return `
        <div class="day-card" data-day="${day}">
            <div class="day-header-row">
                <div class="day-left">
                    <div class="day-number">${day}</div>
                    <div class="day-weekday">${weekday}</div>
                </div>
                <div class="include-toggle-wrapper">
                    <label class="toggle-label">
                        <span>Include</span>
                        <input type="checkbox" class="include-row" />
                        <span class="toggle-track"><span class="toggle-thumb"></span></span>
                    </label>
                </div>
            </div>

            <div class="time-blocks">
                <div class="time-field">
                    <div class="time-label"><span>Start</span></div>
                    <div class="picker-row">
                        <select class="time-select-hour start-hour">${HOUR_OPTIONS}</select>
                        <span class="time-separator">:</span>
                        <select class="time-select-minute start-min">${MIN_OPTIONS}</select>
                    </div>
                </div>

                <div class="time-field">
                    <div class="time-label"><span>Finish</span></div>
                    <div class="picker-row">
                        <select class="time-select-hour finish-hour">${HOUR_OPTIONS}</select>
                        <span class="time-separator">:</span>
                        <select class="time-select-minute finish-min">${MIN_OPTIONS}</select>
                    </div>
                </div>

                <div class="time-field">
                    <div class="time-label"><span>Break Start</span></div>
                    <div class="picker-row">
                        <select class="time-select-hour break-start-hour">${HOUR_OPTIONS}</select>
                        <span class="time-separator">:</span>
                        <select class="time-select-minute break-start-min">${MIN_OPTIONS}</select>
                    </div>
                </div>

                <div class="time-field">
                    <div class="time-label"><span>Break End</span></div>
                    <div class="picker-row">
                        <select class="time-select-hour break-end-hour">${HOUR_OPTIONS}</select>
                        <span class="time-separator">:</span>
                        <select class="time-select-minute break-end-min">${MIN_OPTIONS}</select>
                    </div>
                </div>
            </div>

            <div class="total-today">
                <span class="total-hours">0 hours 0 minutes</span>
            </div>
        </div>`;
    }

    // ---- Calculation helpers ----
    function getMinutesFromHM(cardEl, hourSelClass, minSelClass) {
        const hourSel = cardEl.querySelector(hourSelClass);
        const minSel = cardEl.querySelector(minSelClass);
        if (!hourSel || !minSel) return null;
        const hh = hourSel.value;
        const mm = minSel.value;
        if (hh === "") return null;
        const hNum = Number(hh);
        const mNum = Number(mm);
        return hNum * 60 + mNum;
    }

    // supports crossing midnight
    function diffMinutes(startMin, endMin) {
        if (startMin == null || endMin == null) return 0;
        let diff = endMin - startMin;
        if (diff < 0) diff += 24 * 60;
        return diff;
    }

    function minutesToText(totalMinutes) {
        const hours = Math.floor(totalMinutes / 60);
        const mins = totalMinutes % 60;
        return `${hours} hours ${mins} minutes`;
    }

    function calcCardMinutes(cardEl) {
        const startMin      = getMinutesFromHM(cardEl, '.start-hour', '.start-min');
        const finishMin     = getMinutesFromHM(cardEl, '.finish-hour', '.finish-min');
        const breakStartMin = getMinutesFromHM(cardEl, '.break-start-hour', '.break-start-min');
        const breakEndMin   = getMinutesFromHM(cardEl, '.break-end-hour', '.break-end-min');

        if (startMin != null && finishMin != null) {
            const gross = diffMinutes(startMin, finishMin);
            const brk   = diffMinutes(breakStartMin, breakEndMin);
            let paid = gross - brk;
            if (paid < 0) paid = 0;
            return paid;
        }
        return 0;
    }

    function updateCardDisplay(cardEl) {
        const mins = calcCardMinutes(cardEl);
        const totalEl = cardEl.querySelector('.total-hours');
        if (totalEl) {
            totalEl.textContent = minutesToText(mins);
        }
    }

    function updateTotals() {
        const cards = document.querySelectorAll('.day-card');
        let monthTotal = 0;
        let selectedTotal = 0;

        cards.forEach(card => {
            const mins = calcCardMinutes(card);
            if (mins > 0) {
                monthTotal += mins;
                const includeBox = card.querySelector('.include-row');
                if (includeBox && includeBox.checked) {
                    selectedTotal += mins;
                }
            }
        });

        document.getElementById('grand-total').textContent = minutesToText(monthTotal);
        document.getElementById('selected-total').textContent = minutesToText(selectedTotal);
    }

    // ---- Saving & Loading state to localStorage (per month) ----
    function collectStateFromDOM() {
        const data = [];
        document.querySelectorAll('.day-card').forEach(card => {
            const dayNum = card.getAttribute('data-day');

            const include = card.querySelector('.include-row').checked;

            const startHour  = card.querySelector('.start-hour').value;
            const startMin   = card.querySelector('.start-min').value;
            const finishHour = card.querySelector('.finish-hour').value;
            const finishMin  = card.querySelector('.finish-min').value;
            const bsHour     = card.querySelector('.break-start-hour').value;
            const bsMin      = card.querySelector('.break-start-min').value;
            const beHour     = card.querySelector('.break-end-hour').value;
            const beMin      = card.querySelector('.break-end-min').value;

            data.push({
                day: dayNum,
                include,
                startHour,
                startMin,
                finishHour,
                finishMin,
                breakStartHour: bsHour,
                breakStartMin: bsMin,
                breakEndHour: beHour,
                breakEndMin: beMin
            });
        });
        return data;
    }

    function saveState() {
        const state = collectStateFromDOM();
        const storageKey = getStorageKey(currentYear, currentMonthIndex);
        try {
            localStorage.setItem(storageKey, JSON.stringify(state));
        } catch (err) {
            console.warn("Could not save to localStorage:", err);
        }
    }

    function applyStateToDOM(state) {
        if (!Array.isArray(state)) return;
        state.forEach(savedDay => {
            const card = document.querySelector(`.day-card[data-day="${savedDay.day}"]`);
            if (!card) return;

            const inc = card.querySelector('.include-row');
            if (inc) inc.checked = !!savedDay.include;

            function setVal(selector, val) {
                const el = card.querySelector(selector);
                if (el && typeof val === "string") {
                    el.value = val;
                }
            }

            setVal('.start-hour',        savedDay.startHour);
            setVal('.start-min',         savedDay.startMin);
            setVal('.finish-hour',       savedDay.finishHour);
            setVal('.finish-min',        savedDay.finishMin);
            setVal('.break-start-hour',  savedDay.breakStartHour);
            setVal('.break-start-min',   savedDay.breakStartMin);
            setVal('.break-end-hour',    savedDay.breakEndHour);
            setVal('.break-end-min',     savedDay.breakEndMin);

            updateCardDisplay(card);
        });

        updateTotals();
    }

    function loadState() {
        const storageKey = getStorageKey(currentYear, currentMonthIndex);
        try {
            const raw = localStorage.getItem(storageKey);
            if (!raw) return;
            const parsed = JSON.parse(raw);
            applyStateToDOM(parsed);
        } catch (err) {
            console.warn("Could not load from localStorage:", err);
        }
    }

    // ---- Event handling ----
    function handleAnyChange(e) {
        const cardEl = e.target.closest('.day-card');
        if (cardEl) {
            updateCardDisplay(cardEl);
        }

        updateTotals();
        saveState();
    }

    function attachDayListeners() {
        document.querySelectorAll('.time-select-hour, .time-select-minute').forEach(sel => {
            sel.addEventListener('change', handleAnyChange);
        });

        document.querySelectorAll('.include-row').forEach(chk => {
            chk.addEventListener('change', handleAnyChange);
        });
    }

    // ---- INIT ----
    populateMonthYearSelectors();

    // Set default to current month
    const now = new Date();
    let initialYear = now.getFullYear();
    let initialMonth = now.getMonth();

    monthSelect.addEventListener("change", () => {
        const y = Number(yearSelect.value);
        const m = Number(monthSelect.value);
        setMonthYear(y, m);
    });

    yearSelect.addEventListener("change", () => {
        const y = Number(yearSelect.value);
        const m = Number(monthSelect.value);
        setMonthYear(y, m);
    });

    prevMonthBtn.addEventListener("click", () => changeMonth(-1));
    nextMonthBtn.addEventListener("click", () => changeMonth(1));
    todayBtn.addEventListener("click", () => {
        const today = new Date();
        setMonthYear(today.getFullYear(), today.getMonth());
    });

    window.addEventListener("beforeunload", () => {
        saveState();
    });

    // Start at current month
    setMonthYear(initialYear, initialMonth);
</script>

</body>
</html>
