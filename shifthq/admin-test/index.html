<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ShiftHQ PRO – Admin Test</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f3f5f8;
      color: #111;
      padding: 24px;
    }

    .page {
      width: 100%;
      max-width: 520px;
      margin: 40px auto;
    }

    .card {
      background: white;
      border-radius: 24px;
      padding: 24px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.07);
      margin-bottom: 18px;
    }

    h1 {
      margin: 0 0 4px;
      font-size: 34px;
    }

    h2 {
      margin: 0 0 16px;
      font-size: 24px;
    }

    .subtitle {
      margin: 0 0 24px;
      color: #777;
      font-size: 17px;
    }

    label {
      display: block;
      margin: 14px 0 7px;
      font-weight: 600;
    }

    input {
      width: 100%;
      padding: 14px 15px;
      border: 1px solid #d5d8dd;
      border-radius: 12px;
      font-size: 16px;
      outline: none;
    }

    input:focus {
      border-color: #111;
    }

    button {
      width: 100%;
      margin-top: 18px;
      padding: 15px;
      border: 0;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
      cursor: default;
    }

    .primary {
      background: #111;
      color: white;
    }

    .blue {
      background: #2563eb;
      color: white;
    }

    .light {
      background: #eceef1;
      color: #111;
    }

    .company-box {
      padding: 16px;
      border-radius: 14px;
      background: #f4f5f7;
      margin-bottom: 18px;
    }

    .company-box strong {
      display: block;
      font-size: 19px;
      margin-bottom: 5px;
    }

    .message {
      margin-top: 16px;
      padding: 13px;
      border-radius: 12px;
      display: none;
      line-height: 1.4;
    }

    .error {
      display: block;
      background: #fdecec;
      color: #a12622;
    }

    .success {
      display: block;
      background: #e9f8ee;
      color: #176b34;
    }

    .info {
      display: block;
      background: #eef5ff;
      color: #1d4f91;
    }

    .member {
      padding: 15px 0;
      border-bottom: 1px solid #eceef1;
    }

    .member:last-child {
      border-bottom: 0;
    }

    .member-name {
      font-weight: 700;
      font-size: 17px;
    }

    .member-email {
      color: #666;
      margin-top: 3px;
      word-break: break-word;
    }

    .member-meta {
      display: flex;
      gap: 8px;
      margin-top: 8px;
      flex-wrap: wrap;
    }

    .pill {
      padding: 5px 9px;
      border-radius: 999px;
      font-size: 13px;
      background: #eef0f3;
      color: #333;
    }

    .pill.admin {
      background: #e8efff;
      color: #244ba8;
    }

    .pill.worker {
      background: #eaf8ee;
      color: #176b34;
    }

    .pill.inactive {
      background: #fdecec;
      color: #a12622;
    }

    #dashboard {
      display: none;
    }

    #inviteForm {
      display: none;
      margin-top: 16px;
    }

    .top-actions {
      display: flex;
      gap: 10px;
    }

    .top-actions button {
      margin-top: 0;
    }
  </style>
</head>

<body>

  <div class="page">

    <div class="card" id="loginCard">
      <h1>ShiftHQ PRO</h1>
      <p class="subtitle">Admin Test</p>

      <label for="email">Email</label>
      <input
        id="email"
        type="email"
        placeholder="admin@example.com"
        autocomplete="email"
      >

      <label for="password">Password</label>
      <input
        id="password"
        type="password"
        placeholder="Password"
        autocomplete="current-password"
      >

      <button class="primary" id="loginButton">
        Sign in
      </button>

      <div id="loginMessage" class="message"></div>
    </div>


    <div id="dashboard">

      <div class="card">
        <h1>ShiftHQ PRO</h1>
        <p class="subtitle">Admin Dashboard</p>

        <div class="company-box">
          <strong id="companyName">Loading company…</strong>
          <div>
            Company code:
            <span id="companyCode">—</span>
          </div>
          <div>
            Role:
            <span id="userRole">—</span>
          </div>
        </div>

        <button class="light" id="logoutButton">
          Sign out
        </button>
      </div>


      <div class="card">
        <div class="top-actions">
          <button class="blue" id="toggleInviteButton">
            Invite Worker
          </button>
        </div>

        <div id="inviteForm">

          <label for="workerName">Worker name</label>
          <input
            id="workerName"
            type="text"
            placeholder="John Smith"
          >

          <label for="workerEmail">Worker email</label>
          <input
            id="workerEmail"
            type="email"
            placeholder="worker@example.com"
          >

          <button class="primary" id="sendInviteButton">
            Send invitation
          </button>

          <div id="inviteMessage" class="message"></div>
        </div>
      </div>


      <div class="card">
        <h2>Workers</h2>

        <div id="workersMessage" class="message"></div>
        <div id="workersList">
          Loading…
        </div>
      </div>

    </div>

  </div>


  <script>
    const SUPABASE_URL =
      "https://diqxssqucdylekeexaxk.supabase.co";

    const SUPABASE_PUBLISHABLE_KEY =
      "sb_publishable_zWxqAQuOq2l_3mnj0T4Cnw_FUL9Yvqn";

    const sb = supabase.createClient(
      SUPABASE_URL,
      SUPABASE_PUBLISHABLE_KEY
    );

    let companyId = null;


    function showMessage(elementId, text, type = "error") {
      const el = document.getElementById(elementId);

      el.textContent = text;
      el.className = "message " + type;
    }


    function clearMessage(elementId) {
      const el = document.getElementById(elementId);

      el.textContent = "";
      el.className = "message";
    }


    function escapeHtml(value) {
      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }


    async function login() {
      clearMessage("loginMessage");

      const email =
        document.getElementById("email").value.trim();

      const password =
        document.getElementById("password").value;

      const button =
        document.getElementById("loginButton");

      if (!email || !password) {
        showMessage(
          "loginMessage",
          "Enter your email and password."
        );
        return;
      }

      button.disabled = true;
      button.textContent = "Signing in…";

      const { data, error } =
        await sb.auth.signInWithPassword({
          email,
          password
        });

      button.disabled = false;
      button.textContent = "Sign in";

      if (error) {
        showMessage(
          "loginMessage",
          error.message
        );
        return;
      }

      await loadDashboard(data.user);
    }


    async function loadDashboard(user) {
      if (!user) {
        showLogin();
        return;
      }

      const { data, error } = await sb
        .from("company_members")
        .select(`
          company_id,
          role,
          active,
          companies (
            id,
            name,
            company_code
          )
        `)
        .eq("user_id", user.id)
        .eq("role", "admin")
        .eq("active", true)
        .limit(1)
        .maybeSingle();

      if (error) {
        showMessage(
          "loginMessage",
          "Signed in, but company access could not be loaded: " +
          error.message
        );

        await sb.auth.signOut();
        return;
      }

      if (!data) {
        showMessage(
          "loginMessage",
          "This account is not an active company admin."
        );

        await sb.auth.signOut();
        return;
      }

      companyId = data.company_id;

      document.getElementById("loginCard").style.display =
        "none";

      document.getElementById("dashboard").style.display =
        "block";

      document.getElementById("companyName").textContent =
        data.companies?.name || "Company";

      document.getElementById("companyCode").textContent =
        data.companies?.company_code || "—";

      document.getElementById("userRole").textContent =
        data.role || "—";

      await loadWorkers();
    }


    async function loadWorkers() {
      clearMessage("workersMessage");

      const list =
        document.getElementById("workersList");

      list.textContent = "Loading…";

      const { data, error } = await sb
        .from("company_members")
        .select(`
          id,
          user_id,
          role,
          active,
          profiles (
            full_name,
            email
          )
        `)
        .eq("company_id", companyId)
        .order("joined_at", { ascending: true });

      if (error) {
        list.textContent = "";

        showMessage(
          "workersMessage",
          error.message
        );

        return;
      }

      if (!data || data.length === 0) {
        list.innerHTML =
          "<div>No members found.</div>";

        return;
      }

      list.innerHTML = data.map(member => {

        const profile = member.profiles || {};

        const name =
          profile.full_name?.trim() ||
          (member.role === "admin" ? "Admin" : "Worker");

        const email =
          profile.email || "No email";

        const roleClass =
          member.role === "admin"
            ? "admin"
            : "worker";

        const activeClass =
          member.active
            ? ""
            : "inactive";

        const activeText =
          member.active
            ? "Active"
            : "Inactive";

        return `
          <div class="member">
            <div class="member-name">
              ${escapeHtml(name)}
            </div>

            <div class="member-email">
              ${escapeHtml(email)}
            </div>

            <div class="member-meta">
              <span class="pill ${roleClass}">
                ${escapeHtml(member.role)}
              </span>

              <span class="pill ${activeClass}">
                ${activeText}
              </span>
            </div>
          </div>
        `;
      }).join("");
    }


    async function sendInvitation() {
      clearMessage("inviteMessage");

      const workerName =
        document.getElementById("workerName").value.trim();

      const workerEmail =
        document.getElementById("workerEmail").value.trim();

      const button =
        document.getElementById("sendInviteButton");

      if (!workerEmail) {
        showMessage(
          "inviteMessage",
          "Enter the worker's email address."
        );
        return;
      }

      if (!companyId) {
        showMessage(
          "inviteMessage",
          "No company is loaded."
        );
        return;
      }

      const {
        data: { session }
      } = await sb.auth.getSession();

      if (!session) {
        showMessage(
          "inviteMessage",
          "Your admin session has expired. Sign in again."
        );
        return;
      }

      button.disabled = true;
      button.textContent = "Sending…";

      showMessage(
        "inviteMessage",
        "Creating invitation…",
        "info"
      );

      try {
        const response = await fetch(
          SUPABASE_URL + "/functions/v1/invite-worker",
          {
            method: "POST",

            headers: {
              "Content-Type": "application/json",
              "Authorization":
                "Bearer " + session.access_token,
              "apikey":
                SUPABASE_PUBLISHABLE_KEY
            },

            body: JSON.stringify({
              company_id: companyId,
              email: workerEmail,
              full_name: workerName || null
            })
          }
        );

        const result = await response.json();

        if (!response.ok) {
          throw new Error(
            result.error || "Invitation failed."
          );
        }

        showMessage(
          "inviteMessage",
          "Invitation sent successfully.",
          "success"
        );

        document.getElementById("workerName").value = "";
        document.getElementById("workerEmail").value = "";

      } catch (error) {

        showMessage(
          "inviteMessage",
          error.message || "Invitation failed."
        );

      } finally {

        button.disabled = false;
        button.textContent = "Send invitation";
      }
    }


    function showLogin() {
      companyId = null;

      document.getElementById("dashboard").style.display =
        "none";

      document.getElementById("loginCard").style.display =
        "block";
    }


    async function logout() {
      await sb.auth.signOut();

      document.getElementById("password").value = "";

      showLogin();

      showMessage(
        "loginMessage",
        "Signed out.",
        "success"
      );
    }


    async function checkExistingSession() {
      const {
        data: { session }
      } = await sb.auth.getSession();

      if (session?.user) {
        await loadDashboard(session.user);
      }
    }


    document
      .getElementById("loginButton")
      .addEventListener("click", login);


    document
      .getElementById("logoutButton")
      .addEventListener("click", logout);


    document
      .getElementById("toggleInviteButton")
      .addEventListener("click", () => {

        const form =
          document.getElementById("inviteForm");

        form.style.display =
          form.style.display === "block"
            ? "none"
            : "block";
      });


    document
      .getElementById("sendInviteButton")
      .addEventListener("click", sendInvitation);


    document
      .getElementById("password")
      .addEventListener("keydown", event => {

        if (event.key === "Enter") {
          login();
        }
      });


    checkExistingSession();
  </script>

</body>
</html>
