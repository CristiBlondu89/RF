<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>My hours · ShiftHQ</title><link rel="stylesheet" href="styles.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script><script src="my-hours.js" defer></script></head>
<body><header class="brand"><div><strong>ShiftHQ</strong><span>MY HOURS</span></div><button id="signOut" class="hidden" type="button">Sign out</button></header>
<main><section id="login" class="card login"><p class="eyebrow">YOUR WORK RECORDS</p><h1>Your hours, in one place.</h1><p>Sign in with the email you used to join ShiftHQ. You can view and export your own hours, including records from former employers.</p><form id="loginForm"><label for="email">Email address</label><input id="email" type="email" autocomplete="email" required><button id="sendLink" type="submit">Email me a sign-in link</button></form><p class="muted">For privacy, use your own phone or computer. Sign out when you finish.</p></section>
<p id="message" role="status" aria-live="polite"></p>
<section id="records" class="hidden"><div class="intro"><div><p class="eyebrow">YOUR WORK RECORDS</p><h1>My hours</h1><p id="signedInAs" class="muted"></p></div></div><div class="card controls"><label for="companies">Company</label><select id="companies"></select><form id="filters"><label>From<input id="start" type="date"></label><label>To<input id="end" type="date"></label><button type="submit">Apply dates</button><button id="allTime" type="button" class="secondary">All time</button></form><button id="export" type="button" class="secondary" disabled>Export my hours (CSV)</button></div><div id="history" class="card" aria-live="polite"></div></section>
</main></body></html>
