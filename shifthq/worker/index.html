<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ShiftHQ Kiosk</title>

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    :root {
      --bg: #0f1722;
      --panel: #152130;
      --panel2: #1b2a3b;
      --border: rgba(255,255,255,0.08);
      --text: #ffffff;
      --muted: #9cadbd;
      --accent: #ffffff;
      --green: #48c774;
      --amber: #f5b942;
      --red: #ff5b5b;
      --grey: #718096;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      overflow: hidden;
    }

    button,
    input {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .hidden {
      display: none !important;
    }

    /* -------------------------------------------------- */
    /* SETUP */
    /* -------------------------------------------------- */

    #setupScreen {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .setupCard {
      width: 100%;
      max-width: 480px;
      background: var(--panel);
      padding: 34px;
      border-radius: 26px;
      border: 1px solid var(--border);
    }

    .logo {
      font-size: 36px;
      font-weight: 800;
      margin-bottom: 8px;
    }

    .setupSubtitle {
      color: var(--muted);
      margin-bottom: 30px;
    }

    .setupCard label {
      display: block;
      font-weight: 650;
      margin-bottom: 8px;
    }

    .setupCard input {
      width: 100%;
      padding: 17px;
      border: 1px solid var(--border);
      border-radius: 14px;
      background: #0f1925;
      color: white;
      outline: none;
      font-size: 19px;
      margin-bottom: 14px;
    }

    .setupButton {
      width: 100%;
      border: 0;
      border-radius: 14px;
      padding: 17px;
      font-size: 18px;
      font-weight: 750;
      background: white;
      color: #111;
    }

    .setupStatus {
      margin-top: 16px;
      color: var(--muted);
      font-size: 14px;
    }

    .setupStatus.error {
      color: #ff8b8b;
    }

    /* -------------------------------------------------- */
    /* KIOSK */
    /* -------------------------------------------------- */

    #kioskScreen {
      height: 100vh;
      display: grid;
      grid-template-columns: 390px 1fr;
    }

    .sidebar {
      background: var(--panel);
      border-right: 1px solid var(--border);
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .sidebarHeader {
      padding: 24px 22px 18px;
      border-bottom: 1px solid var(--border);
    }

    .brand {
      font-size: 29px;
      font-weight: 800;
      margin-bottom: 4px;
    }

    .companyName {
      color: var(--muted);
      font-size: 14px;
      margin-bottom: 18px;
    }

    .searchWrap {
      position: relative;
    }

    .searchInput {
      width: 100%;
      background: #0f1925;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 13px 14px;
      color: white;
      outline: none;
      font-size: 16px;
    }

    .workerList {
      overflow-y: auto;
      flex: 1;
    }

    .workerRow {
      display: grid;
      grid-template-columns: 46px 18px 1fr;
      align-items: center;
      gap: 12px;
      width: 100%;
      padding: 15px 18px;
      background: transparent;
      color: white;
      border: 0;
      border-bottom: 1px solid var(--border);
      text-align: left;
    }

    .workerRow:active,
    .workerRow.selected {
      background: var(--panel2);
    }

    .avatar {
      width: 46px;
      height: 46px;
      border-radius: 50%;
      background: #223247;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      font-weight: 750;
    }

    .statusDot {
      width: 11px;
      height: 11px;
      border-radius: 50%;
      background: var(--grey);
    }

    .statusDot.off {
      background: var(--red);
    }

    .statusDot.working {
      background: var(--green);
    }

    .statusDot.on_break {
      background: var(--amber);
    }

    .workerName {
      font-size: 17px;
      font-weight: 650;
    }

    .workerSub {
      color: var(--muted);
      font-size: 12px;
      margin-top: 2px;
      text-transform: capitalize;
    }

    .sidebarFooter {
      padding: 16px 18px;
      border-top: 1px solid var(--border);
    }

    .changeCompany {
      width: 100%;
      background: transparent;
      color: var(--muted);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px;
    }

    /* -------------------------------------------------- */
    /* MAIN */
    /* -------------------------------------------------- */

    .main {
      position: relative;
      background:
        radial-gradient(circle at top right, rgba(72,94,120,0.18), transparent 35%),
        #0f1722;
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 24px 32px;
    }

    .mainCompany {
      color: var(--muted);
      font-size: 15px;
    }

    .topClock {
      text-align: right;
    }

    .topTime {
      font-size: 34px;
      font-weight: 720;
      font-variant-numeric: tabular-nums;
    }

    .topDate {
      margin-top: 2px;
      color: var(--muted);
      font-size: 15px;
    }

    .mainContent {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 30px;
    }

    .welcome {
      text-align: center;
      max-width: 650px;
    }

    .welcomeTitle {
      font-size: 34px;
      font-weight: 760;
      margin-bottom: 10px;
    }

    .welcomeText {
      color: var(--muted);
      font-size: 18px;
    }

    /* -------------------------------------------------- */
    /* PIN */
    /* -------------------------------------------------- */

    .pinPanel {
      width: 100%;
      max-width: 520px;
      text-align: center;
    }

    .selectedName {
      font-size: 34px;
      font-weight: 760;
      margin-bottom: 8px;
    }

    .selectedHint {
      color: var(--muted);
      margin-bottom: 25px;
    }

    .pinDots {
      display: flex;
      justify-content: center;
      gap: 18px;
      margin-bottom: 28px;
    }

    .pinDot {
      width: 18px;
      height: 18px;
      border: 2px solid #8ca0b5;
      border-radius: 50%;
    }

    .pinDot.filled {
      background: white;
      border-color: white;
    }

    .keypad {
      display: grid;
      grid-template-columns: repeat(3, 96px);
      justify-content: center;
      gap: 14px;
    }

    .key {
      height: 76px;
      border-radius: 20px;
      border: 1px solid var(--border);
      background: #172434;
      color: white;
      font-size: 30px;
      font-weight: 650;
    }

    .key:active {
      transform: scale(0.97);
      background: #223247;
    }

    .pinError {
      min-height: 22px;
      color: #ff7d7d;
      margin-top: 20px;
      font-size: 15px;
    }

    /* -------------------------------------------------- */
    /* ACTIONS */
    /* -------------------------------------------------- */

    .actionPanel {
      width: 100%;
      max-width: 600px;
      text-align: center;
    }

    .actionName {
      font-size: 38px;
      font-weight: 780;
      margin-bottom: 8px;
    }

    .statusBadge {
      display: inline-block;
      border-radius: 999px;
      padding: 9px 17px;
      font-size: 15px;
      font-weight: 700;
      margin-bottom: 24px;
      background: #253447;
      color: white;
    }

    .statusBadge.working {
      background: rgba(72,199,116,0.16);
      color: #78e59b;
    }

    .statusBadge.on_break {
      background: rgba(245,185,66,0.16);
      color: #ffd070;
    }

    .statusBadge.off {
      background: rgba(255,91,91,0.13);
      color: #ff8b8b;
    }

    .shiftBox {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 27px;
      margin-bottom: 24px;
    }

    .shiftLabel {
      color: var(--muted);
      font-size: 15px;
      margin-bottom: 6px;
    }

    .shiftTime {
      font-size: 52px;
      font-weight: 780;
      font-variant-numeric: tabular-nums;
    }

    .clockInText {
      color: var(--muted);
      margin-top: 7px;
    }

    .actionButtons {
      display: grid;
      gap: 14px;
    }

    .actionButton {
      width: 100%;
      min-height: 76px;
      border: 0;
      border-radius: 18px;
      font-size: 23px;
      font-weight: 780;
      background: white;
      color: #111;
    }

    .actionButton.secondary {
      background: #243347;
      color: white;
    }

    .actionButton.danger {
      background: rgba(255,91,91,0.15);
      color: #ff8d8d;
      border: 1px solid rgba(255,91,91,0.2);
    }

    .actionMessage {
      min-height: 24px;
      color: var(--muted);
      margin-top: 16px;
    }

    .backButton {
      margin-top: 22px;
      border: 0;
      background: transparent;
      color: var(--muted);
      font-size: 16px;
    }

    @media (max-width: 850px) {
      #kioskScreen {
        grid-template-columns: 320px 1fr;
      }

      .keypad {
        grid-template-columns: repeat(3, 82px);
      }

      .key {
        height: 68px;
      }
    }
  </style>
</head>

<body>

<!-- ==================================================== -->
<!-- ONE-TIME COMPANY SETUP -->
<!-- ==================================================== -->

<div id="setupScreen" class="hidden">
  <div class="setupCard">
    <div class="logo">ShiftHQ</div>
    <div class="setupSubtitle">
      Set up this device as a company kiosk.
    </div>

    <label for="setupCompanyCode">Company code</label>

    <input
      id="setupCompanyCode"
      type="text"
      autocapitalize="characters"
      placeholder="SHIFT001"
    />

    <button id="setupButton" class="setupButton">
      Set up kiosk
    </button>

    <div id="setupStatus" class="setupStatus"></div>
  </div>
</div>


<!-- ==================================================== -->
<!-- KIOSK -->
<!-- ==================================================== -->

<div id="kioskScreen" class="hidden">

  <aside class="sidebar">

    <div class="sidebarHeader">
      <div class="brand">ShiftHQ</div>
      <div id="sidebarCompanyName" class="companyName"></div>

      <input
        id="workerSearch"
        class="searchInput"
        type="text"
        placeholder="Search worker"
      />
    </div>

    <div id="workerList" class="workerList"></div>

    <div class="sidebarFooter">
      <button id="changeCompanyButton" class="changeCompany">
        Change company
      </button>
    </div>

  </aside>


  <main class="main">

    <div class="topbar">
      <div id="mainCompanyName" class="mainCompany"></div>

      <div class="topClock">
        <div id="topTime" class="topTime"></div>
        <div id="topDate" class="topDate"></div>
      </div>
    </div>


    <div class="mainContent">

      <!-- WELCOME -->

      <div id="welcomePanel" class="welcome">
        <div class="welcomeTitle">
          Select your name
        </div>

        <div class="welcomeText">
          Choose yourself from the worker list to continue.
        </div>
      </div>


      <!-- PIN PANEL -->

      <div id="pinPanel" class="pinPanel hidden">

        <div id="selectedWorkerName" class="selectedName"></div>

        <div class="selectedHint">
          Enter your 4-digit PIN
        </div>

        <div class="pinDots">
          <div class="pinDot"></div>
          <div class="pinDot"></div>
          <div class="pinDot"></div>
          <div class="pinDot"></div>
        </div>

        <div class="keypad">
          <button class="key" data-key="1">1</button>
          <button class="key" data-key="2">2</button>
          <button class="key" data-key="3">3</button>

          <button class="key" data-key="4">4</button>
          <button class="key" data-key="5">5</button>
          <button class="key" data-key="6">6</button>

          <button class="key" data-key="7">7</button>
          <button class="key" data-key="8">8</button>
          <button class="key" data-key="9">9</button>

          <button class="key" data-key="clear">C</button>
          <button class="key" data-key="0">0</button>
          <button class="key" data-key="back">⌫</button>
        </div>

        <div id="pinError" class="pinError"></div>

        <button id="cancelPinButton" class="backButton">
          Cancel
        </button>

      </div>


      <!-- ACTION PANEL -->

      <div id="actionPanel" class="actionPanel hidden">

        <div id="actionWorkerName" class="actionName"></div>

        <div id="actionStatusBadge" class="statusBadge"></div>

        <div id="shiftBox" class="shiftBox hidden">

          <div class="shiftLabel">
            Current shift
          </div>

          <div id="shiftTime" class="shiftTime">
            00:00:00
          </div>

          <div id="clockInText" class="clockInText"></div>

        </div>

        <div id="actionButtons" class="actionButtons"></div>

        <div id="actionMessage" class="actionMessage"></div>

        <button id="backToWorkersButton" class="backButton">
          Back to workers
        </button>

      </div>

    </div>

  </main>

</div>


<script>
const SUPABASE_URL =
  "https://diqxssqucdylekeexaxk.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_zWxqAQuOq2l_3mnj0T4Cnw_FUL9Yvqn";


let companyCode = null;
let company = null;
let workers = [];

let selectedWorker = null;
let currentPin = "";

let currentWorkerStatus = null;
let currentShift = null;

let shiftTimerInterval = null;
let inactivityTimer = null;


/* =======================================================
   ELEMENTS
======================================================= */

const setupScreen =
  document.getElementById("setupScreen");

const kioskScreen =
  document.getElementById("kioskScreen");

const setupCompanyCode =
  document.getElementById("setupCompanyCode");

const setupButton =
  document.getElementById("setupButton");

const setupStatus =
  document.getElementById("setupStatus");

const sidebarCompanyName =
  document.getElementById("sidebarCompanyName");

const mainCompanyName =
  document.getElementById("mainCompanyName");

const workerList =
  document.getElementById("workerList");

const workerSearch =
  document.getElementById("workerSearch");

const welcomePanel =
  document.getElementById("welcomePanel");

const pinPanel =
  document.getElementById("pinPanel");

const actionPanel =
  document.getElementById("actionPanel");

const selectedWorkerName =
  document.getElementById("selectedWorkerName");

const pinError =
  document.getElementById("pinError");

const actionWorkerName =
  document.getElementById("actionWorkerName");

const actionStatusBadge =
  document.getElementById("actionStatusBadge");

const shiftBox =
  document.getElementById("shiftBox");

const shiftTime =
  document.getElementById("shiftTime");

const clockInText =
  document.getElementById("clockInText");

const actionButtons =
  document.getElementById("actionButtons");

const actionMessage =
  document.getElementById("actionMessage");

const topTime =
  document.getElementById("topTime");

const topDate =
  document.getElementById("topDate");


/* =======================================================
   API HELPER
======================================================= */

async function postFunction(
  functionName,
  body
) {

  const response = await fetch(
    `${SUPABASE_URL}/functions/v1/${functionName}`,
    {
      method: "POST",

      headers: {
        "Content-Type": "application/json",
        "apikey": SUPABASE_KEY
      },

      body: JSON.stringify(body)
    }
  );


  let data = {};

  try {
    data = await response.json();
  } catch (_) {}


  if (!response.ok) {
    throw new Error(
      data.error || "Request failed."
    );
  }


  return data;
}


/* =======================================================
   CLOCK / DATE
======================================================= */

function updateTopClock() {

  const now =
    new Date();


  topTime.textContent =
    now.toLocaleTimeString(
      [],
      {
        hour: "2-digit",
        minute: "2-digit"
      }
    );


  topDate.textContent =
    now.toLocaleDateString(
      [],
      {
        weekday: "long",
        day: "numeric",
        month: "long"
      }
    );
}


setInterval(
  updateTopClock,
  1000
);


/* =======================================================
   COMPANY SETUP
======================================================= */

setupButton.addEventListener(
  "click",
  async () => {

    const code =
      setupCompanyCode
        .value
        .trim()
        .toUpperCase();


    if (!code) {
      setupStatus.textContent =
        "Enter the company code.";

      setupStatus.className =
        "setupStatus error";

      return;
    }


    setupButton.disabled = true;

    setupStatus.textContent =
      "Loading company...";

    setupStatus.className =
      "setupStatus";


    try {

      const result =
        await loadWorkers(code);


      localStorage.setItem(
        "shifthq_kiosk_company",
        code
      );


      companyCode = code;

      applyCompanyResult(result);

      showKiosk();

    } catch (error) {

      setupStatus.textContent =
        error.message;

      setupStatus.className =
        "setupStatus error";

    }


    setupButton.disabled = false;

  }
);


/* =======================================================
   LOAD WORKERS
======================================================= */

async function loadWorkers(code) {

  return await postFunction(
    "kiosk-workers",
    {
      company_code: code
    }
  );
}


function applyCompanyResult(result) {

  company = result.company;
  workers = result.workers || [];

  sidebarCompanyName.textContent =
    company.name;

  mainCompanyName.textContent =
    company.name;

  renderWorkers();
}


/* =======================================================
   WORKER LIST
======================================================= */

function initials(name) {

  return name
    .split(" ")
    .filter(Boolean)
    .slice(0, 2)
    .map(part => part[0])
    .join("")
    .toUpperCase();
}


function renderWorkers() {

  workerList.innerHTML = "";

  const query =
    workerSearch
      .value
      .trim()
      .toLowerCase();


  const filtered =
    workers.filter(worker =>
      worker.name
        .toLowerCase()
        .includes(query)
    );


  filtered.forEach(worker => {

    const button =
      document.createElement("button");

    button.className =
      "workerRow";


    const currentStatus =
      worker.status || "off";


    button.innerHTML = `
      <div class="avatar">
        ${initials(worker.name)}
      </div>

      <div class="statusDot ${currentStatus}">
      </div>

      <div>
        <div class="workerName">
          ${escapeHtml(worker.name)}
        </div>

        <div class="workerSub">
          ${formatStatus(currentStatus)}
        </div>
      </div>
    `;


    button.addEventListener(
      "click",
      () => selectWorker(worker)
    );


    workerList.appendChild(button);

  });

}


workerSearch.addEventListener(
  "input",
  renderWorkers
);


/* =======================================================
   SELECT WORKER
======================================================= */

function selectWorker(worker) {

  resetInactivityTimer();

  selectedWorker = worker;

  currentPin = "";

  selectedWorkerName.textContent =
    worker.name;

  pinError.textContent = "";

  updatePinDots();

  welcomePanel.classList.add("hidden");
  actionPanel.classList.add("hidden");
  pinPanel.classList.remove("hidden");
}


/* =======================================================
   PIN KEYPAD
======================================================= */

document
  .querySelectorAll(".key")
  .forEach(button => {

    button.addEventListener(
      "click",
      async () => {

        resetInactivityTimer();

        const key =
          button.dataset.key;


        if (key === "clear") {
          currentPin = "";
        }

        else if (key === "back") {
          currentPin =
            currentPin.slice(0, -1);
        }

        else if (
          /^[0-9]$/.test(key) &&
          currentPin.length < 4
        ) {
          currentPin += key;
        }


        updatePinDots();


        if (currentPin.length === 4) {
          await verifySelectedWorker();
        }

      }
    );

  });


function updatePinDots() {

  const dots =
    document.querySelectorAll(
      ".pinDot"
    );


  dots.forEach(
    (dot, index) => {

      dot.classList.toggle(
        "filled",
        index < currentPin.length
      );

    }
  );
}


/* =======================================================
   VERIFY WORKER
======================================================= */

async function verifySelectedWorker() {

  pinError.textContent =
    "Checking PIN...";


  try {

    const result =
      await postFunction(
        "kiosk-action",
        {
          company_id:
            company.id,

          worker_id:
            selectedWorker.id,

          pin:
            currentPin,

          action:
            "status"
        }
      );


    currentWorkerStatus =
      result.status;

    currentShift =
      result.shift;


    showActionPanel(
      result.worker,
      result.status,
      result.shift
    );


  } catch (error) {

    currentPin = "";

    updatePinDots();

    pinError.textContent =
      error.message;

  }

}


/* =======================================================
   ACTION PANEL
======================================================= */

function showActionPanel(
  worker,
  status,
  shift
) {

  resetInactivityTimer();

  pinPanel.classList.add("hidden");
  welcomePanel.classList.add("hidden");
  actionPanel.classList.remove("hidden");


  actionWorkerName.textContent =
    worker.name;


  actionStatusBadge.textContent =
    formatStatus(status);

  actionStatusBadge.className =
    `statusBadge ${status}`;


  actionButtons.innerHTML = "";

  actionMessage.textContent = "";


  stopShiftTimer();


  if (shift?.clock_in) {

    shiftBox.classList.remove(
      "hidden"
    );


    const clockIn =
      new Date(
        shift.clock_in
      );


    clockInText.textContent =
      "Clocked in at " +
      clockIn.toLocaleTimeString(
        [],
        {
          hour: "2-digit",
          minute: "2-digit"
        }
      );


    startShiftTimer(
      shift.clock_in
    );

  } else {

    shiftBox.classList.add(
      "hidden"
    );

  }


  if (status === "off") {

    createActionButton(
      "Clock In",
      "clock_in"
    );

  }


  if (status === "working") {

    createActionButton(
      "Start Break",
      "start_break",
      "secondary"
    );


    createActionButton(
      "Clock Out",
      "clock_out",
      "danger"
    );

  }


  if (status === "on_break") {

    createActionButton(
      "End Break",
      "end_break"
    );


    createActionButton(
      "Clock Out",
      "clock_out",
      "danger"
    );

  }

}


function createActionButton(
  label,
  action,
  style = ""
) {

  const button =
    document.createElement("button");


  button.textContent =
    label;


  button.className =
    `actionButton ${style}`;


  button.addEventListener(
    "click",
    async () => {

      await performAction(
        action,
        button
      );

    }
  );


  actionButtons.appendChild(button);

}


/* =======================================================
   PERFORM CLOCK ACTION
======================================================= */

async function performAction(
  action,
  button
) {

  resetInactivityTimer();

  button.disabled = true;

  actionMessage.textContent =
    "Please wait...";


  try {

    const result =
      await postFunction(
        "kiosk-action",
        {
          company_id:
            company.id,

          worker_id:
            selectedWorker.id,

          pin:
            currentPin,

          action:
            action
        }
      );


    currentWorkerStatus =
      result.status;

    currentShift =
      result.shift;


    updateLocalWorkerStatus(
      selectedWorker.id,
      result.status
    );


    showActionPanel(
      result.worker,
      result.status,
      result.shift
    );


    actionMessage.textContent =
      actionMessageFor(action);


    /*
      Return to worker list shortly after
      completing an action.
    */

    setTimeout(
      () => returnToWorkerList(),
      2500
    );


  } catch (error) {

    actionMessage.textContent =
      error.message;

    button.disabled = false;

  }

}


/* =======================================================
   LOCAL STATUS DOT
======================================================= */

function updateLocalWorkerStatus(
  workerId,
  status
) {

  const worker =
    workers.find(
      item => item.id === workerId
    );


  if (worker) {
    worker.status = status;
  }


  renderWorkers();
}


/* =======================================================
   TIMER
======================================================= */

function startShiftTimer(clockIn) {

  stopShiftTimer();


  const start =
    new Date(clockIn).getTime();


  function update() {

    const seconds =
      Math.max(
        0,
        Math.floor(
          (Date.now() - start) / 1000
        )
      );


    const hours =
      Math.floor(
        seconds / 3600
      );


    const minutes =
      Math.floor(
        (seconds % 3600) / 60
      );


    const secs =
      seconds % 60;


    shiftTime.textContent =
      String(hours).padStart(2, "0")
      + ":"
      + String(minutes).padStart(2, "0")
      + ":"
      + String(secs).padStart(2, "0");
  }


  update();

  shiftTimerInterval =
    setInterval(update, 1000);
}


function stopShiftTimer() {

  if (shiftTimerInterval) {

    clearInterval(
      shiftTimerInterval
    );

    shiftTimerInterval = null;

  }

}


/* =======================================================
   RETURN / TIMEOUT
======================================================= */

function returnToWorkerList() {

  stopShiftTimer();

  selectedWorker = null;
  currentPin = "";
  currentWorkerStatus = null;
  currentShift = null;

  updatePinDots();

  pinError.textContent = "";
  actionMessage.textContent = "";

  pinPanel.classList.add("hidden");
  actionPanel.classList.add("hidden");
  welcomePanel.classList.remove("hidden");

  resetInactivityTimer();
}


function resetInactivityTimer() {

  clearTimeout(
    inactivityTimer
  );


  inactivityTimer =
    setTimeout(
      () => {

        if (
          selectedWorker
        ) {
          returnToWorkerList();
        }

      },
      20000
    );

}


document
  .getElementById(
    "cancelPinButton"
  )
  .addEventListener(
    "click",
    returnToWorkerList
  );


document
  .getElementById(
    "backToWorkersButton"
  )
  .addEventListener(
    "click",
    returnToWorkerList
  );


document.addEventListener(
  "pointerdown",
  resetInactivityTimer
);


/* =======================================================
   CHANGE COMPANY
======================================================= */

document
  .getElementById(
    "changeCompanyButton"
  )
  .addEventListener(
    "click",
    () => {

      const confirmed =
        confirm(
          "Remove this kiosk's company setup?"
        );


      if (!confirmed) {
        return;
      }


      localStorage.removeItem(
        "shifthq_kiosk_company"
      );


      location.reload();

    }
  );


/* =======================================================
   HELPERS
======================================================= */

function formatStatus(status) {

  switch (status) {

    case "working":
      return "Working";

    case "on_break":
      return "On break";

    default:
      return "Clocked out";

  }

}


function actionMessageFor(action) {

  switch (action) {

    case "clock_in":
      return "You are clocked in.";

    case "clock_out":
      return "You are clocked out.";

    case "start_break":
      return "Break started.";

    case "end_break":
      return "Break ended.";

    default:
      return "Done.";

  }

}


function escapeHtml(value) {

  return String(value)
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");

}


/* =======================================================
   INITIALISE
======================================================= */

async function initialise() {

  updateTopClock();

  const savedCode =
    localStorage.getItem(
      "shifthq_kiosk_company"
    );


  if (!savedCode) {

    setupScreen.classList.remove(
      "hidden"
    );

    return;
  }


  try {

    companyCode =
      savedCode;


    const result =
      await loadWorkers(
        savedCode
      );


    applyCompanyResult(
      result
    );


    showKiosk();


  } catch (error) {

    localStorage.removeItem(
      "shifthq_kiosk_company"
    );


    setupStatus.textContent =
      error.message;


    setupStatus.className =
      "setupStatus error";


    setupScreen.classList.remove(
      "hidden"
    );

  }

}


function showKiosk() {

  setupScreen.classList.add(
    "hidden"
  );

  kioskScreen.classList.remove(
    "hidden"
  );

  welcomePanel.classList.remove(
    "hidden"
  );

  resetInactivityTimer();

}


initialise();
</script>
